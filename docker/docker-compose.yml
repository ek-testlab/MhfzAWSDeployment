services:
  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=erupe
    ports:
      - 5432:5432
    volumes:
      - ./db-data/:/var/lib/postgresql/
      - ../schemas/:/schemas/
      - ./init/setup.sh:/docker-entrypoint-initdb.d/setup.sh
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: user@pgadmin.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - 5050:80
    depends_on:
      db:
        condition: service_healthy
  server:
    depends_on:
      db:
        condition: service_healthy
    image: anononetwothree/mhfz-erupe:stable
    volumes:
      - ../config.json:/app/erupe/config.json
      - ../bin:/app/erupe/bin
      - ./savedata:/app/erupe/savedata
    ports:
      - 53312:53312
      - 8080:8080
      - 53310:53310
      - 54001:54001
      - 54002:54002
      - 54003:54003
      - 54004:54004
      - 54005:54005
      - 54006:54006
      - 54007:54007
      - 54008:54008
    restart: unless-stopped
  web:
    image: httpd:latest
    container_name: my-apache-app
    ports:
      - 80:80
    volumes:
      - ./Servers:/usr/local/apache2/htdocs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped